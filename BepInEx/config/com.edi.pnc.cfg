[Gameplay]

## One coherent set of gameplay rules, in place of the individual switches below having to agree. PressureAndRelease - the default - turns on heat locks, class heat scaling and lock-scaled spawn pressure together. Vanilla leaves combat, health, heat and spawning entirely to the game, while scene detection and device playback stay on. GodMode blocks damage and death with no locks. Custom reads the individual Gameplay settings below exactly as it did before profiles existed, which is what a config written back then keeps doing. Under any profile but Custom those individual settings are ignored, so change this to Custom if you want them to take effect. Switchable mid-run from the mod manager.
# Setting type: GameplayProfile
# Default value: PressureAndRelease
# Acceptable values: Vanilla, PressureAndRelease, GodMode, Custom
Profile = PressureAndRelease

## Player survivability tweaks (god mode, enemy heat gain rate, spawn count multiplier).
# Setting type: Boolean
# Default value: true
Enabled = true

## No damage, no death, no grab heat/dragon kill, no game over. Blocked hits can still add heat (see ConvertBlockedDamageToHeat).
# Setting type: Boolean
# Default value: true
GodMode = false

## Replace god-mode survivability with heat locks. Locks clamp minimum heat until released by a one-time keyhole or ambient scene. See HeatLockScaleSource for how many locks there are.
# Setting type: Boolean
# Default value: true
EnableHeatLocks = true

## Cumming during a grab or grapple scene no longer costs HP (vanilla GrabScreen deals maxHeatDamage plus a percentage of max HP, dropping invulnerability to do it). The animation, heat block and cooldown are unchanged.
# Setting type: Boolean
# Default value: true
DisableCumDamage = true

## Overheating still disables attacks and dashes, but clears once heat cools back to the current lock floor instead of vanilla's exactly-0, which a lock floor makes unreachable. With no locks held the floor is 0, i.e. vanilla behaviour.
# Setting type: Boolean
# Default value: true
ClearOverheatAtLockFloor = true

## Which stat sets the horny limit (total number of locks). Heat = the cum meter / heat capacity (default). Health = base class max HP, the pre-2.0.9 behaviour.
# Setting type: String
# Default value: Heat
HeatLockScaleSource = Heat

## Horny locks each heat potion removes, along with the heat those locks were holding, instead of vanilla's flat heat reduction. Matched case-insensitively against the item name, longest key wins. Empty restores the vanilla flat cooling. Only applies while EnableHeatLocks is on.
# Setting type: String
# Default value: small heat potion=2;medium heat potion=5;large heat potion=10
HeatPotionLockRemoval = small heat potion=2;medium heat potion=5;large heat potion=10

## Seconds the player must keep a diorama in view, with line of sight, before its one-time horny release fires. A bar under the Horny readout shows the progress. 0 disables the requirement, restoring the old fire-on-earshot behaviour.
# Setting type: Single
# Default value: 3
AmbientReleaseLookSeconds = 3

## How fast the diorama look meter drains while looking away, relative to how fast it fills. 1 = same speed, 0 = never drains, 2 = drains twice as fast. It drains rather than resetting, so a glance away costs progress instead of the attempt.
# Setting type: Single
# Default value: 1
AmbientReleaseDecayMultiplier = 1

## Diorama scripts only play while the player is at the diorama - inside its gallery-unlock box, widened by AmbientPlaybackTriggerPadding - instead of merely within earshot of it. false restores the earshot-only behaviour, where a diorama heard through a wall drives the device.
# Setting type: Boolean
# Default value: true
AmbientPlaybackRequiresPresence = true

## Seconds a diorama keeps playing after the player steps out of its unlock box. Debounces the box boundary, where the overlap test can flip frame to frame and bounce the device to filler and back. Only used when AmbientPlaybackRequiresPresence is on.
# Setting type: Single
# Default value: 0.25
AmbientPlaybackLingerSeconds = 0.25

## Use the game's own GalleryUnlockTrigger box - the volume that unlocks the diorama's gallery entry when you walk into it - to decide the player is at a diorama, instead of raycasting for line of sight. Hand-placed per diorama by the level designer, so it needs no camera or ray. false falls back to the raycast test.
# Setting type: Boolean
# Default value: true
AmbientReleaseUseUnlockTriggers = true

## Metres of slack around the unlock box for the look meter, since some of the boxes are only a metre across. Raise it if the meter will not start while you are plainly standing at the diorama; the log line 'Xm outside box' says how far short you were.
# Setting type: Single
# Default value: 1.5
AmbientReleaseTriggerPadding = 1.5

## Metres of slack around the unlock box for diorama script playback - deliberately looser than the release, so the script does not cut out as you shift your feet. Only used when AmbientPlaybackRequiresPresence is on.
# Setting type: Single
# Default value: 4
AmbientPlaybackTriggerPadding = 4

## How far off-centre the diorama may be, in degrees, and still count as being looked at while inside its unlock box. 180 accepts any direction. Ignored within 1.5m, where the direction is meaningless.
# Setting type: Single
# Default value: 75
AmbientReleaseLookAngle = 75

## When the game revives the player into a grab scene - which is how dying in a grab plays out as that scene - keep playing the scene's script instead of dropping to damage filler. Vanilla Revive() fires a couple of milliseconds after the scene's gallery is dispatched, so without this the filler stomps it and the whole death scene runs on filler_damage_*. false restores that.
# Setting type: Boolean
# Default value: true
ReviveKeepsSceneGallery = true

## A diorama's one-time release clears every horny lock, the same payout a peephole gives, instead of removing a single one. false restores the single-lock behaviour.
# Setting type: Boolean
# Default value: true
AmbientReleaseClearsAllLocks = true

## true means a grab only adds a horny lock the first time that enemy catches you AT THAT SPOT - the pre-2.0.10 behaviour, and a bug. The guard keyed on the source's position rounded to 0.1m, so a walking enemy earned a lock every time it caught you somewhere new while a stationary one (a mimic chest) earned exactly one per run, and a walking enemy that caught you twice in the same doorway was refused the second. Left as false: every grab locks. Peepholes and dioramas keep their own one-per-source guard, which is what stops those being farmed by walking back and forth.
# Setting type: Boolean
# Default value: false
HeatLockOncePerGrabSource = false

## At full horny lock, a grab screen keeps replaying its cum animation instead of dropping to the grabbed loop between cums. The lock floor is one unit below max heat there, so the bar refills instantly and vanilla would otherwise flick to the loop for a frame or two several times a second - visibly stuttery, and it makes the device jump between two scripts. false restores the flicker.
# Setting type: Boolean
# Default value: true
FullLockHoldsCum = true

## Keep the player heat bar on screen during grab scenes. Hidden by default because it clutters the scene, but it is the only live read of heat while grabbed - useful for checking whether the cum cooldown is moving heat or the horny lock floor is pinning it at the top.
# Setting type: Boolean
# Default value: false
ShowHeatBarDuringGrab = true

## Seconds of grabbed loop guaranteed after a cum ends, before heat starts building again. Below full lock the lock floor can sit one or two units under max, so vanilla refills the bar almost instantly and the next cum triggers before the loop has played - the screen and the device flick between two scenes. This holds the grab screen's own heatIncreaseBlocked for a moment instead. 0 disables it. Does nothing at full lock, where FullLockHoldsCum keeps the cum on screen instead.
# Setting type: Single
# Default value: 2
PostCumGraceSeconds = 2

## A cum in a grab scene ends once heat has cooled to the horny lock floor, instead of vanilla's exactly-0. Vanilla gates the end of the cum animation on heat reaching 0 (HandleHeatBuildup sets heatFullyCooled, which OnMaxHeatAnimationComplete requires), and a lock floor makes 0 unreachable - so without this the cum animation repeats for the whole grab. Same fix as ClearOverheatAtLockFloor.
# Setting type: Boolean
# Default value: true
CumCooldownEndsAtLockFloor = true

## Marker shown under the Horny readout when an unspent diorama release is within reach but not being looked at. Drawn in Unity's builtin Arial, so stick to glyphs that font has - emoji will not render. Empty shows nothing.
# Setting type: String
# Default value: ♦
AmbientNearbyIcon = ♦

## Seconds a peephole scene must be watched before its one-time horny release pays out. A fill bar under the Horny readout shows the progress, and the locks clear the moment it completes. Leaving early costs the progress but not the release - peeking again restarts it. 0 pays out the instant you peek, with no bar.
# Setting type: Single
# Default value: 10
KeyholeReleaseWatchSeconds = 10

## Metres around a looping audio source to look for a peephole trigger. Sources with one that close are treated as peek scenes, not dioramas: no proximity playback and no look-timer release, since peeks are driven by interacting with the hole.
# Setting type: Single
# Default value: 1.5
AmbientPeekHoleRadius = 1.5

## Points of the scaling stat per lock; the horny limit is that stat divided by this, rounded up. Higher means fewer locks to fill. At the default 20, and with ClassHeatMultipliers doubling capacity, the classes get: Knight 5, Rogue 8, Dent Head 10, Mage 13, Ranger 13. At 10 (the pre-2.0.11 value) those were 10/15/20/25/25, which is a lot of locks on the high-capacity classes. Never goes below 1 lock however high this is set.
# Setting type: Int32
# Default value: 20
HeatLockUnitsPerLock = 20

## Auto-heal in HUNDREDTHS of HP per second at 0 heat, while HeatLocks are enabled - ApplyHeatScaledAutoHeal multiplies this by 0.01, so 120 is 1.2 HP/s and the coded default of 1 is 0.01 HP/s (one HP per 100 seconds, effectively off). Healing scales down quadratically with heat and stops at max heat. Releases ship 120 via release.py SHIPPED; the coded default is left at 1 only because changing it would silently alter every existing user config on next launch.
# Setting type: Single
# Default value: 1
HeatLockAutoHealRate = 120

## Remove 1 heat. Heat cannot go below 0.
# Setting type: KeyboardShortcut
# Default value: KeypadMinus
RemoveHeatKey = KeypadMinus

## Add 1 heat.
# Setting type: KeyboardShortcut
# Default value: KeypadMultiply
AddHeatKey = KeypadMultiply

## Do not despawn/kill the enemy when a grab (H-scene) starts or ends. Only applies to enemies the game still destroys: 0.3.1 prefabs with hideInsteadOfDestroyOnGrab are handled by the game itself and this setting does not touch them.
# Setting type: Boolean
# Default value: true
KeepEnemiesAfterGrab = true

## Refuse a mimic interaction while the player is in post-grab immunity, instead of letting it burn the mimic's one-shot flag on a grab the game will decline. MimicEnemy.TriggerMimicGrab checks only IsGrabbed, while GrabScreen.StartGrab also checks CanBeGrabbed - so interacting within ~1s of escaping a scene used to leave the chest standing and permanently uninteractable. false restores that.
# Setting type: Boolean
# Default value: true
MimicGrabRespectsGrabImmunity = true

## Seconds a mimic may sit with its one-shot flag set while no scene is running before it is re-armed anyway. Backstop for any route that burns the flag without producing a scene; the normal scene-end re-arm is much faster, so this only rescues genuinely stuck chests. 0 disables it. Needs KeepEnemiesAfterGrab.
# Setting type: Single
# Default value: 3
MimicStrandedRearmSeconds = 3

## Re-arm a mimic the moment its scene ends, skipping EnemyReactivationDelaySeconds. That delay exists to stop an enemy resuming its AI and instantly re-grabbing you; a mimic has no AI and interacting with it is voluntary, so it only made a chest you walked back to sit inert. false puts mimics back on the shared enemy delay.
# Setting type: Boolean
# Default value: true
MimicReactivateInstantly = true

## Seconds an enemy may sit in a coroutine-driven state with no coroutine running before it is returned to Idle. SpinningEnemyAI (Grabbing/Shooting) and ChargingEnemyAI (PreparingCharge/Charging) have no case for those states in UpdateStateMachine, so recovery depends entirely on the sequence coroutine finishing - and the transition sets the state before deciding whether to start one. The other four AI classes handle every state they can enter and are not patched. 0 disables the watchdog.
# Setting type: Single
# Default value: 0.5
AiUnstickSeconds = 0.5

## Stop the DRAGONS committing to a grab the game is about to refuse. GrabScreen.StartGrab declines while the player is in post-grab immunity or already grabbed. EnemyAI, SpinningEnemyAI and ProjectileEnemyAI all check for that and cancel the swing themselves, so they are left alone; DragonEnemyAI and ProximityDragonEnemyAI do not - they burn hasTriggeredDragonGrab, stop their coroutine and call RemoveEnemyAfterGrab anyway, removing the dragon from the level with no scene played. false restores vanilla.
# Setting type: Boolean
# Default value: true
EnemyGrabRespectsGrabImmunity = true

## Seconds after grab end to keep blocking destroy/death on that enemy.
# Setting type: Single
# Default value: 5
KeepEnemiesAfterGrabGraceSeconds = 5

## Health an enemy killed during an H-scene comes back with. Snapshot = what it had when the scene started (default). A number = that percent of max, e.g. 50 for the pre-2.0.9 behaviour. 0 = never revive, leaving it down but still present. Vanilla destroys the enemy outright after a grab, so for that set KeepEnemiesAfterGrab=false instead.
# Setting type: String
# Default value: Snapshot
GrabReviveHealth = Snapshot

## Seconds after a scene ends before hidden/released enemies regain AI and can act again. They become visible immediately when the scene ends. A player weapon swing (animation/PerformAttack) or weapon heat gain wakes waiting enemies immediately.
# Setting type: Single
# Default value: 5
EnemyReactivationDelaySeconds = 5

## Every EnemyInactiveAutofixInterval seconds, reactivate visible-but-stuck enemies near the player. Skips enemies still in the post-scene reactivation delay.
# Setting type: Boolean
# Default value: true
EnemyInactiveAutofix = true

## Seconds between inactive-enemy autofix scans.
# Setting type: Single
# Default value: 20
EnemyInactiveAutofixInterval = 20

## Radius (m) around the player for inactive-enemy autofix scans.
# Setting type: Single
# Default value: 40
EnemyInactiveAutofixRadius = 40

## Shown max HP when GodMode is on (bar stays full while invulnerable).
# Setting type: Int32
# Default value: 999999
PlayerMaxHealth = 999999

## Multiplier for heat gained during enemy grapple and grab scenes (0.2 = 20% of vanilla rate). Weapon heat is unchanged.
# Setting type: Single
# Default value: 0.2
EnemyHeatGainRate = 0.2

## Per-class max-heat multipliers after class stats apply. Exact class name = factor (e.g. Mage=3;Knight=2). Unlisted classes use 1 (vanilla). Shown in class selection UI.
# Setting type: String
# Default value: Knight=2;Rogue=2;Mage=2;Ranger=2;Dent Head=2
ClassHeatMultipliers = Knight=2;Rogue=2;Mage=2;Ranger=2;Dent Head=2

## With GodMode, enemy hits that would deal damage add heat instead (same amount as the blocked damage).
# Setting type: Boolean
# Default value: true
ConvertBlockedDamageToHeat = true

## Enemies per spawn wave at ZERO horny locks, as a multiple of what the room spawns in vanilla. 1 (default) is vanilla. SpawnCountMultiplierAtFullLock is the same figure at full lock and the game interpolates between the two on lock progress, so this is the floor of the ramp rather than a flat multiplier - it was 2 until it was noticed that an unlocked room was spawning double before the run had started. Also relaxes min distance to player, which is divided by whatever the ramp currently reads, so more spawn points qualify; at 1 that leaves vanilla's distance alone.
# Setting type: Single
# Default value: 1
SpawnCountMultiplier = 1

## Enemies per spawn wave at FULL horny lock, as a multiple of what the room spawns in vanilla. SpawnCountMultiplier is the same figure at zero locks, and the game interpolates between the two on lock progress - so with the defaults a room goes from vanilla to 2.5x as the locks fill. How much each lock adds therefore depends on how many locks the character has (locks/total, and the total scales with max heat): a character with 13 locks steps up in thirteenths, one with 5 in fifths. Clamped to never fall below SpawnCountMultiplier.
# Setting type: Single
# Default value: 2.5
SpawnCountMultiplierAtFullLock = 2.5

## Metres to scatter the extra enemies added by SpawnCountMultiplier around their spawn point, so they do not spawn inside each other. Each candidate is floor-snapped and rejected if it is occupied or behind a wall; if none is found the original point is reused.
# Setting type: Single
# Default value: 2
SpawnScatterRadius = 2

## Master switch for the mod changing how normal spawners choose an enemy. What it does is set by EnemySpawnMode; false patches nothing and the game spawns exactly as shipped.
# Setting type: Boolean
# Default value: true
EnemySpawnShuffle = true

## Semicolon-separated enemy keys the shuffle is allowed to spawn. The shuffle *replaces* the spawner's own choice, so a walkable enemy left off this list never appears in a run at all - which is what happened to the goonshroom, added by game 0.3.1 while this list was still the six pre-0.3.1 types. Each key needs a Tools/Spawn<Key>NameHint to find its prefab; a key with no hint is skipped and logged. Chaser bosses (dragon, wendigo) are refused here whatever this says - they have their own mechanic. Empty restores vanilla spawning.
# Setting type: String
# Default value: imp;gargoyle;gooper;nun;zombie;plantasha;goonshroom
EnemySpawnShufflePool = imp;gargoyle;gooper;nun;zombie;plantasha;goonshroom

## How EnemySpawnShuffle changes spawning. 'grappler-bias' (default) keeps the per-room enemy table the game authored and only raises the odds of the enemies named in GrapplerSpawnKeys, by GrapplerSpawnWeight; a room whose table has no grappler is left exactly as vanilla rolls it. 'pool' is the older behaviour: every spawner in the game rolls EnemySpawnShufflePool instead of its own table, which makes every room the same mix and discards the goonshroom nests and single-enemy rooms the scenes actually contain. 'vanilla' patches nothing. The debug SpawnShufflePoolKey uses EnemySpawnShufflePool in every mode.
# Setting type: String
# Default value: grappler-bias
EnemySpawnMode = grappler-bias

## Semicolon-separated EnemyData asset names weighted up by grappler-bias mode. These are the game's own names as they appear in a spawner's table (Imp, GoonShroom, Nun, Gooper, Gargoyle, Zombie Enemy, PlantEnemy, Black Serpent, Blinded Beast), NOT the mod's enemy keys. Default is the clinging family, which is what has cling scripts behind it.
# Setting type: String
# Default value: Imp;GoonShroom
GrapplerSpawnKeys = Imp;GoonShroom

## Weight multiplier applied to each GrapplerSpawnKeys entry in a spawner's own table. 1 is vanilla odds. 1.5 (default) makes a grappler half again as likely as any other single entry in the same room - deliberately gentle, because it lands on top of a room the spawn multiplier has already inflated and on top of grapple reinforcement, which spawns up to two more grapplers once a grapple starts. Note the table may already repeat a name to weight it - the game does this - and each occurrence is weighted separately, so a table listing Imp twice at x2 rolls imp four times as often as a name listed once.
# Setting type: Single
# Default value: 1.5
GrapplerSpawnWeight = 1.5

## Relative spawn weight for imps when EnemySpawnShuffle is on (2 = twice as likely as each other normal enemy type).
# Setting type: Single
# Default value: 2
ImpSpawnWeightMultiplier = 2

