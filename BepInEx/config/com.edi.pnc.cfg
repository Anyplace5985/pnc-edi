# Default value: 1
GrappleReinforcementRamp = 1

## Stop calling imps in at this many attached. Vanilla GrappleScreenobject.maxGrappleCount (3 on the shipped prefab) is a hard cap above this - StartGrapple refuses past it, the grapple UI animator has no fourth state and the cling scenes are named prefix + count - so a higher value only ever lowers to it.
# Setting type: Int32
# Default value: 3
GrappleReinforcementCeiling = 3

## Dying while something is grappling you plays out as that creature's trio scene instead of a deferred game over: health stays at 0, you can no longer shake the grapplers off, and more of them are called in until the scene takes over. The game over is presented when that scene ends. Applies to every clinging family (imps and goonshrooms both carry a trio grab scene); the setting stays under [Imp] so an existing config still answers to it.
# Setting type: Boolean
# Default value: true
GrappleDeathSequence = true

## Seconds between imp spawns during the grapple death sequence. Overrides GrappleReinforcementInterval, and applies even when GrappleReinforcement is off.
# Setting type: Single
# Default value: 1
GrappleDeathImpInterval = 1

## Grapple UI text during the grapple death sequence, replacing "Shake mouse to escape!" while the struggle is disabled. Empty leaves the vanilla text.
# Setting type: String
# Default value: Overwhelmed!
GrappleDeathText = Overwhelmed!

[Interactive]

## Hook interactive H-scene triggers (CameraSwapTrigger: Baphomet glory hole, Gravy hole, etc).
# Setting type: Boolean
# Default value: true
Enabled = true

[Naming]

## Semicolon-separated `controller_substring=suffix`. When the grab-screen animator is running a matching controller, the suffix is appended to the resolved gallery name. This exists for enemies with two grab screens whose animator states are named identically: game 0.3.1's Blinded Beast is a two-stage miniboss, and both BlindedBeastGrabScreen and BlindedBeastTransformedGrabScreen declare states called exactly Loop and Cum, so both stages would otherwise resolve to blinded_beast_loop despite their clips being different lengths. Longest matching key wins. Empty disables it.
# Setting type: String
# Default value: BlindedBeastTransformedGrabScreen=_t
GrabVariantSuffixes = BlindedBeastTransformedGrabScreen=_t

## Semicolon-separated `prefab_or_galleryId=key` map. Case-insensitive substring match. Longer keys first.
# Setting type: String
# Default value: Hood_Enemy NoTape=nun;Hood_Enemy=nun;Mimic=mimic;Gooper=gooper;Gargoyle=gargoyle;Dragon=dragon;Baphomet=baphomet;Baph=baphomet;Gravy=gravy;Minotaur=gravy;minotaur=gravy;Minothaur=gravy;minothaur=gravy;Wendigo=wendigo;Imp_Enemy=imp;GoonShroom_Enemy=goonshroom;Goon Shroom=goonshroom;GoonShroom=goonshroom;Black Serpent Enemy=serpent;BlackSerpent=serpent;Black Serpent=serpent;Blinded Beast=blinded_beast;BlindedBeast=blinded_beast;Plantasha_Enemy=plantasha;Plantasha=plantasha;Zombie_Enemy=zombie;Zombie=zombie
EnemyRemap = Hood_Enemy NoTape=nun_alt;Zombie_Enemy=zombie;Zombie=zombie;Plantasha_Enemy=plantasha;Plantasha=plantasha;Hood_Enemy=nun;Mimic=mimic;Gooper=gooper;Gargoyle=gargoyle;Dragon=dragon;Baphomet=baphomet;Baph=baphomet;Gravy=gravy;Minotaur=gravy;minotaur=gravy;Minothaur=gravy;minothaur=gravy;Wendigo=wendigo;Imp_Enemy=imp;GoonShroom_Enemy=goonshroom;Goon Shroom=goonshroom;GoonShroom=goonshroom;Black Serpent Enemy=serpent;BlackSerpent=serpent;Black Serpent=serpent;Blinded Beast=blinded_beast;BlindedBeast=blinded_beast

## Overrides for the built-in animator-state to gallery table (see GalleryTable.cs in the source). Empty by default: the table ships in the DLL so updates reach you. Anything listed here is applied on top and wins, and survives a plugin update. Same syntax as before - semicolon-separated <natural_name>=<alias>, target '-' means skip the state entirely, and a target may end with '?seek=<ms>'.
# Setting type: String
# Default value: 
GalleryAliases = nun_cum=Nun_Cum_Gallery;gooper_start=Gooper_Start_Gallery;gooper_cum=Gooper_Cum_Gallery;imp_1=imp_1_Gallery;imp_2=imp_2_Gallery;imp_3=imp_3_Gallery;plantasha_start=Plantasha_Start_Gallery;plantasha_cum=Plantasha_Cum_Gallery;imp_loop=imp_grab_loop_Gallery;imp_cum=imp_grab_cum_Gallery;wendigo_start=Wendigo_Start_Gallery;dragon_grabbed=Dragon_Grabbed_Gallery;serpent_loop=Serpent_Loop_Gallery;blinded_beast_cum=BlindedBeast_Cum_Gallery;blinded_beast_start_t=BlindedBeast_Start_T_Gallery;blinded_beast_cum_t=BlindedBeast_Cum_T_Gallery;goonshroom_loop=GoonShroom_Start_Gallery;goonshroom_cum=GoonShroom_Cum_Gallery;goonshroom_1=goonshroom_1_Gallery;goonshroom_2=goonshroom_2_Gallery;goonshroom_3=goonshroom_3_Gallery

## Overrides for the built-in live-gameplay alias table (see GalleryTable.cs). Checked before the shared table when a hook fires from live gameplay; the gallery viewer ignores it. Empty by default - the table ships in the DLL.
# Setting type: String
# Default value: 
InGameAliases = nun_cum=Nun_Cum;gooper_cum=Gooper_Cum;imp_1=imp_1;imp_2=imp_2;imp_3=imp_3;plantasha_cum=Plantasha_Cum;serpent_loop=Serpent_Loop;blinded_beast_cum=BlindedBeast_Cum;blinded_beast_cum_t=BlindedBeast_Cum_T;goonshroom_cum=GoonShroom_Cum;goonshroom_1=goonshroom_1;goonshroom_2=goonshroom_2;goonshroom_3=goonshroom_3

[Tools]

## Enable noclip + teleport hotkeys for finding/recording ambient scenes.
# Setting type: Boolean
# Default value: true
EnableFreecam = true

## Toggle noclip flight (Space=up, Ctrl/Shift=down, WASD=move). F1 again to exit â€” works even while holding Ctrl/Shift/Alt for movement.
# Setting type: KeyboardShortcut
# Default value: F1
ToggleFreecamKey = F1

## Allow hotkeys to spawn test enemies in front of the player.
# Setting type: Boolean
# Default value: true
EnableDebugEnemySpawn = true

## Spawn a zombie in front of the player (debug). Cycles through all matching prefab variants (e.g. normal + ALT1).
# Setting type: KeyboardShortcut
# Default value: Alpha1
SpawnZombieKey = Alpha1

## Spawn a plantasha in front of the player (debug). Cycles prefab variants when multiple match.
# Setting type: KeyboardShortcut
# Default value: Alpha2
SpawnPlantashaKey = Alpha2

## Spawn a gargoyle in front of the player (debug).
# Setting type: KeyboardShortcut
# Default value: Alpha3
SpawnGargoyleKey = Alpha3

## Spawn a gooper in front of the player (debug).
# Setting type: KeyboardShortcut
# Default value: Alpha4
SpawnGooperKey = Alpha4

## Spawn a mimic in front of the player (debug). On M rather than a digit: the digit row is the ten walking enemies in encounter order, and the mimic is furniture that waits for you rather than something that walks up, so it reads better off the row than squeezed into it.
# Setting type: KeyboardShortcut
# Default value: M
SpawnMimicKey = M

## Spawn a nun in front of the player (debug). Cycles hood / alt prefab variants.
# Setting type: KeyboardShortcut
# Default value: Alpha5
SpawnNunKey = Alpha5

## Spawn an imp in front of the player (debug).
# Setting type: KeyboardShortcut
# Default value: Alpha7
SpawnImpKey = Alpha7

## Spawn a chaser boss in front of the player (debug). The dragon and the wendigo share this key and cycle like any other prefab variant - press again for the other one; the log names which. They are one key because they are one mechanic: both are chaser bosses, both are refused by the spawn shuffle, and both take EndGrabDelaySecondsChaserBoss and a full heat lock-out rather than the ordinary grab treatment.
# Setting type: KeyboardShortcut
# Default value: Alpha0
SpawnChaserBossKey = Alpha0

## Spawn a Blinded Beast in front of the player (debug). No spawner's own enemyData table lists the Blinded Beast, so an ordinary room can never roll one; only a Floor 2 arena spawn group can. Its EnemyData asset is not loaded until something asks for it, which is why the resolver loads the Resources folder before searching.
# Setting type: KeyboardShortcut
# Default value: Alpha9
SpawnBlindedBeastKey = Alpha9

## Spawn a goonshroom in front of the player (debug). The prefab hint already existed for GrappleReinforcement; this binds a key to it so a cling can be tested without finding a nest. Sits next to the imp as the other half of the clinging family.
# Setting type: KeyboardShortcut
# Default value: Alpha8
SpawnGoonShroomKey = Alpha8

## Spawn a Black Serpent in front of the player (debug). Key 6, between the ordinary enemies and the two grapplers, because that is where it sits in the row's own logic: the digit row runs 1-5 ordinary, 6 serpent, 7-8 clinging, 9-0 miniboss and boss. It was the only walkable enemy with no key at all - the serpent is in eleven vanilla spawner tables and the Gooper&Serpent arena group, so it can be met in play, but nothing could ask for one, which left SerpentHypnosis the one system in the mod that could not be tested on demand.
# Setting type: KeyboardShortcut
# Default value: Alpha6
SpawnSerpentKey = Alpha6

## Spawn a random enemy from the shuffle pool in front of the player (debug). Logs pool contents and picked type.
# Setting type: KeyboardShortcut
# Default value: Period
SpawnShufflePoolKey = Period

## Distance (m) in front of the player for debug enemy spawns.
# Setting type: Single
# Default value: 10
SpawnEnemyDistance = 10

## Prefab name substring for debug zombie spawn. Pipe-separated hints match any variant (e.g. zombie|alt). Each press cycles through all matching prefabs.
# Setting type: String
# Default value: zombie
SpawnZombieNameHint = zombie

## Prefab name substring for debug plantasha spawn.
# Setting type: String
# Default value: plantasha
SpawnPlantashaNameHint = plantasha

## Gargoyle enemy prefabs (Gargoyle / Gargoyle Alt). Same hint used for the debug key and the shuffle pool.
# Setting type: String
# Default value: Gargoyle|Gargoyle Alt|gargoyle
SpawnGargoyleNameHint = Gargoyle|Gargoyle Alt|gargoyle

## Prefab name substring for debug gooper spawn.
# Setting type: String
# Default value: gooper
SpawnGooperNameHint = gooper

## Prefab name substring for the debug mimic spawn. MimicEnemy IS the chest mimic: it disguises itself with chestSprite, draws an outline while you are in interactionRange, and springs its grab when you press Interact. The two prefabs, Mimic and Weapons Mimic, are the common-chest and weapon-chest disguises and cycle on the one key. The `Mimic wall fuck` objects are the D8 diorama, a static scene with no MimicEnemy on it.
# Setting type: String
# Default value: mimic
SpawnMimicNameHint = mimic

## Prefab name substring for debug nun spawn. Pipe-separated hints match normal + alt variants.
# Setting type: String
# Default value: hood|nun
SpawnNunNameHint = hood|nun

## Prefab name substrings for the debug chaser-boss spawn. Pipe-separated, so both bosses answer to the one key and each press cycles to the next matching prefab.
# Setting type: String
# Default value: dragon|wendigo
SpawnChaserBossNameHint = dragon|wendigo

## Black Serpent enemy prefab. Matched before the bare 'serpent' so a peek-scene or diorama prop named for the serpent cannot win the lookup ahead of the enemy.
# Setting type: String
# Default value: black serpent|blackserpent|serpent
SpawnSerpentNameHint = black serpent|blackserpent|serpent

## Prefab name substring for debug imp spawn.
# Setting type: String
# Default value: imp
SpawnImpNameHint = imp

## Prefab name substring for goonshroom spawns. Used by GoonShroom/GrappleReinforcement, which is what spawns them in play, and by SpawnGoonShroomKey.
# Setting type: String
# Default value: goonshroom
SpawnGoonShroomNameHint = goonshroom

## Prefab name substring for debug Blinded Beast spawn. Pipe-separated hints match any variant. The miniboss transforms into its second stage itself, so one prefab covers both stages and both grab screens.
# Setting type: String
# Default value: blindedbeast|blinded beast|blinded
SpawnBlindedBeastNameHint = blindedbeast|blinded beast|blinded

## Let the debug hotkeys (spawns, heat, dumps) fire while another key is held. BepInEx's KeyboardShortcut.IsDown additionally requires that NO other key is down, so a spawn key does nothing while you are walking - which is most of the time you want it. Explicitly configured modifiers are still required. false restores BepInEx behaviour.
# Setting type: Boolean
# Default value: true
DebugHotkeysIgnoreHeldKeys = true

