# Setting type: String
# Default value: wendigo
GrabGameOverGrabEnemyKeys = wendigo

## End the current grab H-scene, grapple, or camera-swap interact scene (after EndGrabDelaySeconds). Default: Q.
# Setting type: KeyboardShortcut
# Default value: Q
EndGrabKey = Q

## Instantly end the current H-scene (debug). Default: numpad +. Shift+= also works.
# Setting type: KeyboardShortcut
# Default value: KeypadPlus
EndGrabDebugKey = KeypadPlus

