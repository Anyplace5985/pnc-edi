## Semicolon-separated enemy keys treated as minibosses: their grab costs HeatLockMinibossLocks horny locks instead of one and holds you for EndGrabDelaySecondsMiniboss instead of EndGrabDelaySeconds. Keys are the ones Naming/EnemyRemap produces, so `blinded_beast`, not the prefab name. Chaser bosses (dragon, wendigo) are not listed here - they already have their own heavier treatment, a full lock-out and EndGrabDelaySecondsChaserBoss. Empty makes every enemy ordinary again.
# Setting type: String
# Default value: blinded_beast
