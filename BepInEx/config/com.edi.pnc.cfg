GargoyleSpinRangeScale = 0.8

## Gargoyle delay between spins (>1 = less spinning). 1 = vanilla.
# Setting type: Single
# Default value: 1.18
GargoyleSpinCooldownScale = 1.18

## Plantasha melee grab attempt rate (dash/H-scene, no grab projectile). 1 = vanilla.
